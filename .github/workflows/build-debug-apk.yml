name: Build debug APK

on:
  push:
    branches: [devel]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android is deliberately NOT used: it runs
      # `sdkmanager tools`, and that package no longer exists in the SDK repo,
      # so the action exits 1. The runner image already ships cmdline-tools.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # The parsers library comes from JitPack (see app/build.gradle); no local
      # publishing is needed, the artifact is already built upstream.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kotatsu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
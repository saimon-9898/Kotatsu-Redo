name: Build debug APK

on:
  push:
    branches: [devel]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --licenses <<< "y" || true
          sdkmanager "platforms;android-37" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # The parsers library comes from JitPack (see app/build.gradle); no local
      # publishing is needed, the artifact is already built upstream.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kotatsu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error